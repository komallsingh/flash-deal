
name: Flash Deal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: flash_deal
          POSTGRES_USER: flash_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flash_user -d flash_deal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/flash_deal
      DATABASE_USER: flash_user
      DATABASE_PASSWORD: test_password
      JWT_SECRET: test-jwt-secret-for-ci
      WEBHOOK_SECRET: test-webhook-secret-for-ci
      CLAIM_TTL_SECONDS: 600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
