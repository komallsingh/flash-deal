services:
  postgres:
    image: postgres:15
    container_name: flash-deal-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: flash_deal
      POSTGRES_USER: flash_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash_user -d flash_deal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: